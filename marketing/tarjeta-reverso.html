<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Reverso</title>
<style>
  :root{--green:#0e7a3b;--green-d:#0a5a2c;--red:#c62828;--red-d:#a81f1f;--cream:#f8f2e2;--ink:#241d16;--muted:#6b5e4f;--line:#e4d9c0;}
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{width:3.5in;height:2in;overflow:hidden;background:#fff;}
  body{font-family:"Helvetica Neue",Arial,sans-serif;color:var(--ink);-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  .serif{font-family:Georgia,"Times New Roman",serif;}
  .card{width:3.5in;height:2in;position:relative;overflow:hidden;
    background:linear-gradient(180deg,#fbf7ec,var(--cream));display:flex;padding:0.2in 0.24in 0.17in;gap:0.18in;}
  .tri{position:absolute;left:0;right:0;height:7px;display:flex;z-index:2;}
  .tri i{flex:1;} .tri .g{background:var(--green);} .tri .w{background:#fff;} .tri .r{background:var(--red);}
  .info{flex:1;display:flex;flex-direction:column;}
  .bn{font-family:Georgia,serif;font-weight:700;font-size:15px;color:var(--green-d);line-height:1;}
  .sub{font-size:7.6px;letter-spacing:1.4px;text-transform:uppercase;color:var(--red-d);font-weight:700;margin-top:3px;}
  .rowe{font-size:9.7px;color:#33291f;line-height:1.5;margin-top:9px;}
  .rowe .i{color:var(--green);font-weight:700;} .rowe b{color:var(--ink);}
  .web{margin-top:auto;font-family:Georgia,serif;font-weight:700;font-size:11px;color:var(--green-d);}
  .qrwrap{width:1.32in;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .qrwrap .box{background:#fff;border:1px solid var(--line);border-radius:8px;padding:5px;}
  .qrwrap svg{width:1.12in;height:1.12in;display:block;}
  .qrwrap .cap{font-size:7.5px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-top:5px;text-align:center;font-weight:700;}
</style></head>
